name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Until the secrets exist, skip with a warning instead of failing every push.
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping the Cloudflare deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Secrets pasted into GitHub often carry a stray newline or space; strip it, then ask
      # Cloudflare whether the token is valid (prints only its length and the verdict).
      - name: Verify Cloudflare token
        if: steps.creds.outputs.ready == 'true'
        run: |
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "token length: ${#CLOUDFLARE_API_TOKEN} (${#token} after trimming whitespace)"
          curl -s -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/user/tokens/verify             | python3 -c "import sys,json; d=json.load(sys.stdin); print('verify:', d.get('success'), [e.get('message') for e in d.get('errors', [])], (d.get('result') or {}).get('status'))"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - run: npm run deploy:cloudflare
        if: steps.creds.outputs.ready == 'true'
